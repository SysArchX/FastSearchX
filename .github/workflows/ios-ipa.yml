name: iOS (unsigned .ipa)

# Produces an .ipa of the Flutter app (app/ folder) on a macOS GitHub Actions runner.
# The .ipa comes out UNSIGNED: to install it on the iPhone, re-sign it with your Apple ID
# usando Sideloadly, AltStore, Xcode (janela Devices) ou similar.
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version"
        required: false
        default: "3.47.9"
      build_name:
        description: "Build name (versionName)"
        required: false
        default: "2.0.0"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS (release, no codesign)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          pod --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: |
          flutter --version
          flutter pub get

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        working-directory: app
        run: |
          set -eux
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          NAME="FastSearchX-${VERSION}-ios-unsigned"
          rm -rf Payload "$NAME.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$NAME.ipa" Payload
          shasum -a 256 "$NAME.ipa" | tee "$NAME.ipa.sha256"
          ls -lh "$NAME.ipa"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: FastSearchX-ios-unsigned-ipa
          path: |
            app/FastSearchX-*-ios-unsigned.ipa
            app/FastSearchX-*-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90
